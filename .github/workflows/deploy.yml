name: Request Render deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  request-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require main branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != 'refs/heads/main' ]]; then
            echo '::error::Run this manual workflow from main after its validation checks pass.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Request deployment from Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: bash scripts/request_render_deploy.sh
