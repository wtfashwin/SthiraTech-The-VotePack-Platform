name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/api/**'
      - 'scripts/request_render_deploy.sh'
      - 'scripts/tests/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'scripts/request_render_deploy.sh'
      - 'scripts/tests/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/votepack_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: votepack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: 'packages/api/requirements*.txt'
      - name: Install application and check dependencies
        run: python -m pip install -r packages/api/requirements-dev.txt
      - name: Lint
        run: ruff check packages/api --select E,F,W,I --ignore E501
      - name: Type check
        run: mypy packages/api --ignore-missing-imports
      - name: Test API with PostgreSQL
        run: python -m pytest packages/api/tests -v --cov=packages/api --cov-report=term-missing --cov-report=xml
      - name: Test deployment preflight without network requests
        run: python -m unittest discover -s scripts/tests -v
      - name: Upload measured coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: 'packages/api/requirements*.txt'
      - name: Install application and check dependencies
        run: python -m pip install -r packages/api/requirements-dev.txt
      - name: Scan application code with Bandit
        run: bandit -r packages/api --exclude packages/api/tests -f json -o bandit-report.json
      - name: Audit installed dependency versions
        run: pip-audit --format json --output dependency-audit.json --progress-spinner off
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-reports
          path: |
            bandit-report.json
            dependency-audit.json
