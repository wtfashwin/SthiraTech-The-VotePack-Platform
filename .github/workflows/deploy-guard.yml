name: Validate Render deployment guard

on:
  push:
    paths:
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-guard.yml
      - scripts/request_render_deploy.sh
      - scripts/tests/test_render_deploy.py
  pull_request:
    paths:
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-guard.yml
      - scripts/request_render_deploy.sh
      - scripts/tests/test_render_deploy.py

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check shell syntax
        run: bash -n scripts/request_render_deploy.sh
      - name: Test deployment guard without provider requests
        run: python -m unittest discover -s scripts/tests -p 'test_render_deploy.py' -v
