name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'packages/web/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'packages/web/package-lock.json'

    - name: Install dependencies
      run: |
        cd packages/web
        npm ci

    - name: Lint with ESLint
      run: |
        cd packages/web
        npm run lint || true

    - name: Type check with TypeScript
      run: |
        cd packages/web
        npx tsc --noEmit

    - name: Run tests
      run: |
        cd packages/web
        npm test || echo "Tests not implemented yet"

    - name: Build
      run: |
        cd packages/web
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: packages/web/dist
        retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        urls: |
          http://localhost:5173
        uploadArtifacts: true
        temporaryPublicStorage: true
      continue-on-error: true
